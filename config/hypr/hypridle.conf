# Idle policy: lock after 5 minutes, suspend after 15.
# Video playback and other idle inhibitors pause every listener by default.
general {
    lock_cmd = lock-screen
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
