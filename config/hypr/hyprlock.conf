# Tokyo Night lock screen.
background {
    monitor =
    path = $LOCK_WALLPAPER
    color = rgba(1a1b26ff)
    blur_passes = 2
    blur_size = 7
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

general {
    fail_timeout = 2000
}

input-field {
    monitor =
    size = 400, 90
    rounding = -1
    outline_thickness = 3
    outer_color = rgba(565f89ff)
    check_color = rgba(7dcfffff)
    fail_color = rgba(ff7a93ff)
    inner_color = rgba(1a1b26cc)
    font_color = rgba(a9b1d6ff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    check_text = <i>Checking...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, 0
    halign = center
    valign = center
}

# Clock — bottom right, 24h.
label {
    monitor =
    text = $TIME
    color = rgba(a9b1d6ff)
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    text_align = right
    position = -40, 40
    halign = right
    valign = bottom
}

# Date — stacked above the clock.
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B %Y'
    color = rgba(565f89ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    text_align = right
    position = -40, 100
    halign = right
    valign = bottom
}
