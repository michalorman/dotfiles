# General behavior
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set-option -g base-index 0
set-option -g renumber-windows on
set-option -g history-limit 50000
set-option -sg escape-time 0
set-option -g focus-events on
set-option -g mouse on

# Terminal capabilities
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB"

# Keep new panes and windows in the current pane's directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Vi-style copy mode with X clipboard support.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Reload without restarting tmux.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Tokyo Night status line: show only the window list.
set-option -g status-style "bg=#1a1b26,fg=#a9b1d6"
set-option -g status-left ""
set-option -g status-right ""
set-option -g status-justify left
set-option -g window-status-separator ""
set-option -g window-status-format " #I:#W "
set-option -g window-status-current-format " #I:#W "
set-option -g window-status-style "fg=#565f89,bg=#1a1b26"
set-option -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"

set-option -g pane-border-style "fg=#3b4261"
set-option -g pane-active-border-style "fg=#7aa2f7"
set-option -g message-style "fg=#c0caf5,bg=#3b4261"
set-option -g mode-style "fg=#1a1b26,bg=#7dcfff"
